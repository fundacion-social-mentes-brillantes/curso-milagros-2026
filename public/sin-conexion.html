<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01110E">
<title>Un Curso de Milagros · Conectando</title>
<!--
  Pantalla que muestra el trabajador de fondo (OneSignalSDKWorker.js) cuando la
  app se abre sin conexión y todavía no hay una copia guardada de esa página.
  En vez del error de Safari («el servidor no responde»), dice qué pasa y
  reintenta sola: apenas haya señal, se abre la lección. Todo va aquí dentro
  (sin archivos aparte) porque justo no hay internet para pedirlos.
-->
<style>
  :root { --fondo: #01110E; --texto: #EDE6D3; --suave: rgba(237, 230, 211, 0.68); --oro: #E2BE6E; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(60% 45% at 50% 30%, rgba(40, 190, 165, 0.16), transparent 70%), var(--fondo);
    color: var(--texto);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px 16px;
  }
  main { max-width: 26rem; text-align: center; }
  .libro { width: 64px; height: 64px; margin: 0 auto 20px; color: var(--oro); }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 10px; }
  p { color: var(--suave); margin: 0 0 22px; }
  .gira { width: 28px; height: 28px; margin: 0 auto 22px; border-radius: 50%;
    border: 3px solid rgba(226, 190, 110, 0.25); border-top-color: var(--oro); animation: gira 1s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gira { animation-duration: 3s; } }
  button { font: inherit; font-weight: 600; color: var(--fondo); background: var(--texto); border: 0;
    border-radius: 999px; padding: 12px 24px; cursor: pointer; }
  small { display: block; margin-top: 16px; color: var(--suave); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <svg class="libro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 5.5c3-.2 6 .4 9 2 3-1.6 6-2.2 9-2v12c-3-.2-6 .4-9 2-3-1.6-6-2.2-9-2z" /><path d="M12 7.5v12" />
  </svg>
  <h1>Conectando con el curso…</h1>
  <p>La conexión de este celular está lenta o se cortó un momento. Lo seguimos intentando solos: apenas haya señal, se abre tu lección. Tu avance está a salvo.</p>
  <div class="gira" role="status" aria-label="Reintentando"></div>
  <button type="button" id="reintentar">Reintentar ahora</button>
  <small id="estado">Reintentando cada pocos segundos…</small>
</main>
<script>
  (function () {
    var probando = false;
    function probar() {
      if (probando) return;
      probando = true;
      fetch("/manifest.webmanifest?prueba=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (r.ok) location.reload(); })
        .catch(function () {})
        .then(function () { probando = false; });
    }
    document.getElementById("reintentar").addEventListener("click", function () {
      document.getElementById("estado").textContent = "Intentando…";
      location.reload();
    });
    window.addEventListener("online", probar);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) probar(); });
    setInterval(probar, 4000);
  })();
</script>
</body>
</html>
